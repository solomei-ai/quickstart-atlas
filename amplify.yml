version: 1
frontend:
    phases:
        preBuild:
            commands:
                - nvm install
                - nvm use

                # Configure npm auth for the private @solomei-ai registry (npm.callimacus.ai)
                - echo "@solomei-ai:registry=https://npm.callimacus.ai/" > .npmrc
                - echo "//npm.callimacus.ai/:_authToken=${CALLIMACUS_NPM_TOKEN}" >> .npmrc

                # Install dependencies
                - npm ci --cache .npm --prefer-offline
        build:
            commands:
                - npm run build
    artifacts:
        baseDirectory: dist
        files:
            - '**/*'
    cache:
        paths:
            - '.npm/**/*'
